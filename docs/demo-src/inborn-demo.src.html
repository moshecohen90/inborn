<title>Inborn Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0A0D11;--s1:#12161B;--s2:#181D23;--s3:#1E242B;--well:#0E1115;--bd:#1F262E;--bds:#2E3842;
  --t1:#EEF2F5;--t2:#9AA6B2;--t3:#667380;
  --acc:#F0B35B;--sealed:#3ECF8E;--dgr:#F25555;--cta:#E6EAEE;
  --accfill:#F0B35B;--sealedfill:#3ECF8E;--hdrbg:rgba(10,13,17,.86);--meshdot:rgba(255,255,255,.035);
  --glow:rgba(240,179,91,.38);--bloom:rgba(62,207,142,.28);
  --sans:"IBM Plex Sans","IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --eo:cubic-bezier(.23,1,.32,1);--eio:cubic-bezier(.77,0,.175,1);
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{margin:0;color:var(--t1);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(240,179,91,.6);outline-offset:2px}
::selection{background:rgba(240,179,91,.25)}

/* ---------- page chrome (Hebrew, RTL) ---------- */
.stage{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);gap:0 24px;padding:0 24px 32px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:18px 0 14px;border-bottom:1px solid var(--bd);margin-bottom:22px;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.top .brand .m{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--t3);font-weight:500;direction:ltr}
.top .ctrls{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--s1)}
.seg button{padding:7px 12px;font-size:13px;color:var(--t2);transition:background 120ms,color 120ms}
.seg button.on{background:var(--s3);color:var(--t1)}
.btn{padding:7px 12px;border:1px solid var(--bd);border-radius:10px;font-size:13px;color:var(--t2);background:var(--s1);transition:transform 120ms var(--eo),color 120ms}
.btn:hover{color:var(--t1)}.btn:active{transform:scale(.97)}
.top a{color:var(--acc);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(240,179,91,.4)}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1px solid var(--bd);color:var(--t2);direction:ltr;vertical-align:middle}
.pill.pro{color:var(--acc);border-color:rgba(240,179,91,.5);background:rgba(240,179,91,.1)}
.pill.free{color:var(--sealed);border-color:rgba(62,207,142,.45);background:rgba(62,207,142,.08)}
.screens{align-self:start;position:sticky;top:20px}
.screens .h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--t3);margin:0 0 8px;direction:ltr;text-align:right}
.screens button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--t2);font-size:14px;text-align:right;transition:background 120ms,color 120ms}
.screens button .sn{font-family:var(--mono);font-size:10.5px;color:var(--t3);min-width:30px;direction:ltr;text-align:left}
.screens button:hover{background:var(--s1);color:var(--t1)}
.screens button.on{background:var(--s2);color:var(--t1)}
.screens button.on .sn{color:var(--acc)}
.notes{align-self:start;position:sticky;top:20px;border-inline-start:1px solid var(--bd);padding-inline-start:18px;font-size:13.5px;color:var(--t2)}
.notes h3{margin:0 0 4px;font-size:15px;color:var(--t1)}
.notes .sn{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.06em;direction:ltr;display:inline-block;margin-bottom:6px}
.notes ul{margin:8px 0 0;padding-inline-start:18px}
.notes li{margin:0 0 6px}
.notes .k{font-family:var(--mono);font-size:11px;color:var(--t3);letter-spacing:.06em;direction:ltr;display:block;margin-top:14px}
@media (max-width:1180px){.stage{grid-template-columns:200px minmax(0,1fr)}.notes{display:none}}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr);padding:0 12px 24px}.screens{position:static;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.screens .h{display:none}.screens button{width:auto;padding:6px 10px;border:1px solid var(--bd)}}

/* ---------- device ---------- */
.devwrap{display:flex;justify-content:center;align-items:flex-start;direction:ltr}
.device{position:relative;background:var(--bg);border:1px solid var(--bds);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.03);overflow:hidden;font-family:var(--sans);color:var(--t1);text-align:left}
.device.phone{width:390px;height:844px;border-radius:44px}
.device.desktop{width:1120px;height:720px;border-radius:12px}
.device.light{--bg:#F3F5F7;--s1:#FFFFFF;--s2:#EEF1F4;--s3:#E9EDF1;--well:#E9EDF1;--bd:#DDE3E9;--bds:#C5CDD5;--t1:#12161B;--t2:#4A5560;--t3:#6B7682;--acc:#7A4708;--sealed:#0B7A4C;--dgr:#C93A3A;--cta:#12161B;--hdrbg:rgba(243,245,247,.86);--meshdot:rgba(0,0,0,.06);color-scheme:light;border-color:#C5CDD5}
@media (max-width:1180px){.device.desktop{width:100%;max-width:1120px}}
.statusbar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:8px 28px 0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1)}
.statusbar .r{display:flex;gap:6px;align-items:center}
.statusbar svg{width:16px;height:16px;display:block}
.device.desktop .statusbar{display:none}
.titlebar{display:none;height:40px;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--bd);background:var(--s1);font-size:12.5px;color:var(--t2)}
.titlebar .dots{display:flex;gap:6px}.titlebar .dots i{width:11px;height:11px;border-radius:50%;background:var(--bds);display:block}
.titlebar .m{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--sealed);margin-left:auto}
.device.desktop .titlebar{display:flex}
.app{position:absolute;inset:50px 0 0 0;display:grid;grid-template-columns:minmax(0,1fr)}
.device.desktop .app{inset:40px 0 0 0;grid-template-columns:280px minmax(0,1fr)}
.sidebar{display:none;border-right:1px solid var(--bd);background:var(--s1);overflow:auto}
.device.desktop .sidebar{display:block}
.main{position:relative;min-width:0;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:1;transition:opacity 180ms var(--eo)}
.scr[hidden]{display:none}
.device.desktop .scr{max-width:100%}
.device.desktop .scr .col{max-width:760px;width:100%;margin:0 auto}

/* header */
.hdr{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--bd);background:var(--hdrbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:0 0 auto;z-index:2}
.hdr .hb{padding:8px 8px;border-radius:10px;color:var(--t2);font-size:15px;display:flex;align-items:center;gap:6px;min-height:44px}
.hdr .hb:hover{color:var(--t1)}
.hdr .ctr{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--sealed);font-weight:500}
.hdr .ttl{font-weight:600;font-size:16px}
.device.desktop .hdr .only-phone{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--t2);min-height:34px;transition:transform 120ms var(--eo)}
.chip:active{transform:scale(.97)}
.chip svg{width:12px;height:12px}
.chip.pro{color:var(--acc)}

/* seal */
.seal{display:inline-block;width:28px;height:28px;position:relative;vertical-align:middle}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.seal .track{fill:none;stroke:var(--bds);stroke-width:3}
.seal .arc{fill:none;stroke:var(--sealedfill);stroke-width:3;stroke-linecap:round;stroke-dasharray:106.8;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 260ms var(--eo),stroke 180ms}
.seal .core{fill:var(--accfill);opacity:.9}
.seal.big{width:72px;height:72px}.seal.huge{width:96px;height:96px}
.seal.open .arc{stroke-dashoffset:22;stroke:var(--t3)}
.seal.loading .arc{stroke:var(--accfill)}
.app[data-seal="generating"] .seal:not(.static) .arc{animation:breathe 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px var(--glow))}
.app[data-seal="generating"] .seal.huge .arc{filter:drop-shadow(0 0 14px var(--glow))}
.seal.sealing .arc{animation:sealpop 420ms cubic-bezier(.2,1.4,.5,1) both}
.seal.sealing::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,var(--bloom),transparent 70%);animation:bloom 600ms var(--eo) both}
.seal.listen .arc{stroke:var(--sealedfill);animation:listen 1.1s ease-in-out infinite}
.seal.speak .arc{stroke:var(--accfill);animation:breathe .9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes sealpop{0%{transform:rotate(-90deg) scale(.96)}60%{transform:rotate(-90deg) scale(1.03)}100%{transform:rotate(-90deg) scale(1)}}
@keyframes bloom{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes listen{0%,100%{stroke-width:3}50%{stroke-width:4.5}}
@media (prefers-reduced-motion:reduce){.seal .arc,.seal.sealing::after{animation:none!important;filter:none!important}}

/* generic layout bits */
.col{flex:1 1 auto;overflow:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{background:var(--bds);border-radius:3px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:500}
.mono b{color:var(--sealed);font-weight:500}.mono i{color:var(--acc);font-style:normal}.mono s{color:var(--dgr);text-decoration:none}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.card.sel{border-color:rgba(62,207,142,.55)}
.card h4{margin:0 0 4px;font-size:16px;font-weight:600}
.card p{margin:0;color:var(--t2);font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:10px;background:var(--cta);color:var(--bg);font-weight:600;font-size:15px;transition:transform 120ms var(--eo),opacity 120ms}
.cta:active{transform:scale(.98)}.cta[disabled]{opacity:.45;cursor:default}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--bd);color:var(--t2);font-weight:500;font-size:14px;transition:transform 120ms var(--eo),color 120ms}
.ghost:hover{color:var(--t1)}.ghost:active{transform:scale(.98)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);min-height:48px}
.row:last-child{border-bottom:0}
.row .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .l small{color:var(--t3);font-size:12.5px}
.row .lbl{font-size:15px}
.tog{width:46px;height:28px;border-radius:14px;background:var(--bds);position:relative;flex:0 0 auto;transition:background 180ms}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t1);transition:transform 180ms var(--eo)}
.tog.on{background:var(--sealedfill)}.tog.on::after{transform:translateX(18px)}
.segm{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--well)}
.segm button{padding:7px 10px;font-size:12.5px;color:var(--t2)}.segm button.on{background:var(--s3);color:var(--t1)}
.disp{font-size:32px;line-height:1.18;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.t22{font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.01em;margin:0}
.t2{color:var(--t2)}.t3{color:var(--t3)}
.mesh{background-image:radial-gradient(var(--meshdot) 1px,transparent 1px);background-size:8px 8px}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,8px);background:var(--s3);border:1px solid var(--bds);color:var(--t1);padding:10px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity 180ms var(--eo),transform 180ms var(--eo);pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.device.desktop .toast{bottom:40px}
.warnbar{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(240,179,91,.5);background:rgba(240,179,91,.1);border-radius:10px;font-size:13px;color:var(--t1)}
.warnbar.ok{border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.1)}
.warnbar .m{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--sealed)}
.warnbar svg{width:16px;height:16px;flex:0 0 auto}
.ic{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.press{transition:transform 120ms var(--eo)}.press:active{transform:scale(.97)}

/* onboarding */
.onb .col{padding:28px 24px 28px;justify-content:space-between}
.onb .top-b{display:flex;flex-direction:column;gap:18px}
.onb .disc{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--t3);text-align:center;margin:8px 0 0}
.steps{display:flex;gap:6px;justify-content:center;margin-top:6px}
.steps i{width:22px;height:3px;border-radius:2px;background:var(--bds);display:block}.steps i.on{background:var(--acc)}
.runs{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--t2)}
.runs svg{width:14px;height:14px}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.airbox{background:var(--well);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.airbox .q{background:var(--s1);border-radius:14px 14px 4px 14px;padding:9px 12px;align-self:flex-end;max-width:85%}
.airbox .a{font-size:16px;line-height:1.55}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;color:var(--t2)}
.kv2 b{color:var(--t1);font-weight:600}
.olist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.olist li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.olist .n{font-family:var(--mono);font-size:11px;color:var(--acc);padding-top:4px;min-width:16px}

/* chat */
.chatlist{flex:1 1 auto;overflow:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.chatlist::-webkit-scrollbar{width:6px}.chatlist::-webkit-scrollbar-thumb{background:var(--bds);border-radius:3px}
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 0}
.empty .sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.empty .sug button{padding:8px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);font-size:13.5px;min-height:38px}
.empty .sug button:hover{color:var(--t1)}
.msg{max-width:100%;font-size:16px;line-height:1.56}
.msg.me{align-self:flex-end;background:var(--s1);border-radius:14px 14px 4px 14px;padding:9px 13px;max-width:85%;white-space:pre-wrap}
.msg.me[dir=rtl]{border-radius:14px 14px 14px 4px}
.msg.ai{align-self:stretch;display:flex;flex-direction:column;gap:6px}
.msg.ai .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:flex;gap:8px;flex-wrap:wrap}
.msg.ai .lbl i{color:var(--acc);font-style:normal}
.msg.ai .txt{white-space:pre-wrap;word-wrap:break-word}
.msg.ai .txt code{font-family:var(--mono);font-size:.9em;background:var(--well);border:1px solid var(--bd);border-radius:4px;padding:0 4px}
.msg.ai .txt[dir=rtl]{text-align:right}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--t1);vertical-align:-.15em;margin-left:1px;animation:blink 600ms steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wait{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t3);animation:breathe 1s ease-in-out infinite}
.cite{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--s2);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--t2);margin:2px 4px 0 0;vertical-align:middle}
.cite svg{width:11px;height:11px}
.ledger{font-family:var(--mono);font-size:11px;color:var(--t3);letter-spacing:.04em;display:flex;flex-direction:column;gap:4px}
.ledger button{color:var(--t3);text-align:left;display:flex;gap:6px;align-items:center;min-height:28px}
.ledger button:hover{color:var(--t2)}
.ledger .body{display:none;border-top:1px solid var(--bd);padding-top:6px;line-height:1.7}
.ledger.open .body{display:block}
.acts{display:none;gap:4px;flex-wrap:wrap}
.msg.ai.open .acts{display:flex}
.msg.ai .txt{cursor:default}
.acts button{padding:5px 9px;border-radius:8px;border:1px solid var(--bd);font-size:12.5px;color:var(--t2);min-height:32px}
.acts button:hover{color:var(--t1)}
.safety{border:1px solid rgba(62,207,142,.45);background:rgba(62,207,142,.07);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.safety b{font-weight:600}
.safety .r{display:flex;gap:8px}
.safety .r button{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);font-size:12.5px;color:var(--t1)}
.composer{flex:0 0 auto;padding:6px 12px 14px;border-top:1px solid var(--bd);background:var(--bg)}
.meter{height:2px;background:var(--bd);border-radius:1px;margin:0 4px 8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--t3);transition:width 280ms var(--eo)}
.meter i.hot{background:var(--accfill)}
.cbox{display:flex;align-items:flex-end;gap:6px;background:var(--well);border:1px solid var(--bd);border-radius:10px;padding:5px 6px 5px 6px;transition:border-color 180ms}
.cbox:focus-within{border-color:rgba(240,179,91,.6)}
.cbox .ib{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);flex:0 0 auto}
.cbox .ib:hover{color:var(--t1)}
.cbox textarea{flex:1 1 auto;resize:none;background:none;border:0;color:var(--t1);font:inherit;font-size:16px;line-height:1.4;padding:8px 4px;max-height:150px;min-height:36px;outline:none}
.cbox textarea::placeholder{color:var(--t3)}
.send{width:36px;height:36px;border-radius:50%;background:var(--cta);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform 120ms var(--eo),background 120ms}
.send:active{transform:scale(.94)}
.send.stop{background:var(--s3);color:var(--t1);border:1px solid var(--bds)}
.send svg{width:18px;height:18px}
.attachbar{display:flex;gap:8px;padding:0 4px 8px;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);font-size:12.5px}
.attach .m{font-family:var(--mono);font-size:10.5px;color:var(--t3)}
.attach svg{width:14px;height:14px}
.attach button{color:var(--t3);margin-left:4px}
.incog .chatlist{background:var(--well)}
.incog .hdr .ctr{color:var(--t2)}

/* chats drawer */
.search{display:flex;align-items:center;gap:8px;background:var(--well);border:1px solid var(--bd);border-radius:10px;padding:0 10px;min-height:40px;color:var(--t3);font-size:14px}
.search svg{width:16px;height:16px}
.search input{flex:1;background:none;border:0;color:var(--t1);font:inherit;outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:8px 0 2px;display:flex;justify-content:space-between;align-items:center}

.citem:hover{background:var(--s2)}

.citem .t{flex:1;min-width:0;display:flex;flex-direction:column}
.citem .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.citem .t small{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dfoot{border-top:1px solid var(--bd);padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}

/* vault */
.cart{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.cart.locked{opacity:.55}
.cart .h{display:flex;align-items:center;gap:8px}
.cart .dot{width:8px;height:8px;border-radius:2px;background:var(--bds);flex:0 0 auto}
.cart .dot.on{background:var(--sealedfill)}.cart .dot.have{background:var(--t2)}.cart .dot.dl{background:var(--accfill)}
.cart .nm{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--t1);font-weight:500}
.cart .nm small{color:var(--t3);font-weight:400;letter-spacing:.04em;text-transform:none}
.cart .spec{font-family:var(--mono);font-size:11px;color:var(--t2);letter-spacing:.03em;display:flex;gap:10px;flex-wrap:wrap}
.cart .spec i{color:var(--acc);font-style:normal}
.cart .bar{height:2px;background:var(--bd);border-radius:1px;overflow:hidden}
.cart .bar i{display:block;height:100%;width:0;background:var(--accfill);transition:width 220ms linear}
.cart .bar.full i{width:100%;background:var(--sealedfill)}
.cart .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cart .ft .st{font-family:var(--mono);font-size:10.5px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}

  if(/17\s*[x×*]\s*23/.test(q)) return {t:"391.\n\n17 × 23 = 17 × 20 + 17 × 3 = 340 + 51."};
  if(/translat|תרגם/.test(q)) return {t:ANSWERS.translate, rtl:true};
  if(/draft|email|message to/.test(q)) return {t:ANSWERS.draft};
  if(/rome|trip|itinerary/.test(q)) return {t:ANSWERS.rome};
  if(/summar|lease|contract|document|pdf/.test(q) && (S.attach.length || S.pro)) return {t:ANSWERS.doc, cites:true};
  if(/summar|lease|contract|document|pdf/.test(q)) return {t:"Attach the file first (the + button) and I'll summarise it here, on the phone. Free plan: one file up to 20 pages per chat.\n\nWith Pro, a whole document library stays indexed on the device and every answer cites the page."};

async function getModel(id){

}

async function runAction(k, custom){
  if(actAbort) actAbort.abort(); const ac=new AbortController(); actAbort=ac;
  const a = custom ? {t:"Rewritten with no client names or amounts:\n\nThe tenant may end the agreement after the first year with three months' notice; an earlier exit carries a two-month penalty."} : ACTS[k];
  S.actResult={k:custom?'custom':k, text:'', rtl:!!a.rtl}; S.actRunning=true; setSeal('generating'); renderActions();
  await sleep(350);
  for(const w of a.t.split(/(?<=\s)/)){ if(ac.signal.aborted) return; S.actResult.text+=w; const el=$('#actTxt'); if(el) el.innerHTML=esc(S.actResult.text)+'<span class="caret"></span>'; await sleep(28+Math.random()*20); }
  S.actRunning=false; setSeal('sealed'); renderActions();
}

  if(d.go){ go(d.go); return; }
  if(d.onb!==undefined){ if(d.nolock){ S.lock=false; } if(d.instantonly){ toast('Staying on Instant. Get Fast any time in the vault.'); } if(d.onb==='done'){ go('chat'); if(S.lock) toast(DEVICE.bio+' on. Lock after '+S.lockDelay+'.'); } else { S.step=+d.onb; renderOnb(); } return; }

    if(k==='ncincog'){ NC.incog=!NC.incog; b.classList.toggle('on',NC.incog); return; }
    if(k==='pesensitive'){ PE.sensitive=!PE.sensitive; b.classList.toggle('on',PE.sensitive); return; }
    S[k]=!S[k]; b.classList.toggle('on',S[k]);
    if(k==='lock' && S.screen==='onb') renderOnb();
    if(k==='shotBlock' && S[k]) toast('Screenshots blocked. Your own too.');
    return;
  }
  if(d.delay){ S.lockDelay=d.delay; renderOnb(); return; }
  if(d.set){ S[d.set]=d.val; renderSettings(); if(d.set==='theme'){ applyTheme(); toast(d.val==='System'?'Following the system setting.':d.val+' theme. Same tokens, both ways.'); } if(d.set==='profile') toast(d.val==='Eco'?'Eco: fewer threads, cooler phone.':d.val==='Max'?'Max: all GPU layers. Watch the heat.':'Balanced.'); return; }
  if(d.sug!==undefined){ $('#input').value=''; if(/lease/i.test(d.sug) && !S.attach.length) S.attach.push({name:'Lease_2026.pdf',pages:14,state:'indexed'}); send(d.sug); return; }
  if(b.id==='sendBtn'){ if(S.generating) stop(); else { const v=$('#input').value; $('#input').value=''; $('#input').style.height='auto'; send(v);} return; }
  if(b.id==='micBtn'){ go('voice'); return; }
  if(b.id==='voiceEnd'){ voiceRun=null; setSeal('sealed'); go('chat'); return; }
  if(d.sheet){ openSheet(d.sheet); return; }
  if(d.close){ closeSheet(); return; }
  if(d.pick){ S.model=d.pick; closeSheet(); renderChat(); toast(`Switched to ${S.catalog.find(c=>c.id===d.pick).name}.`); return; }
  if(d.attachk){ closeSheet(); if(d.attachk==='file'){ if(S.attach.length&&!S.pro){ go('paywall'); toast('Free plan: one file per chat.'); return; } S.attach.push({name:'Lease_2026.pdf',pages:14,state:'indexed'}); toast('Lease_2026.pdf · 14 pages · indexed on device'); } else { S.attach.push({name:d.attachk==='camera'?'IMG_0412.heic':'Screenshot.png',pages:1,state:'ready'}); toast('EXIF stripped. Stays on device.'); } renderChat(); return; }
  if(d.detach){ S.attach=S.attach.filter(a=>a.name!==d.detach); renderChat(); return; }
  if(d.act){
    if(d.act==='copy') toast('Copied.');
    if(d.act==='copyx') toast('Copied. Clears in 60 s.');
    if(d.act==='read') toast('Reading aloud with the system voice.');
    if(d.act==='report') openSheet('report');
    if(d.act==='regen'){ const i=S.msgs.findIndex(m=>m.id===d.id); const prompt=S.msgs[i-1]?.text||''; S.msgs.splice(i-1,2); send(prompt); }
    return;
  }
  if(d.ledger!==undefined || b.closest('.ledger')){ b.closest('.ledger').classList.toggle('open'); return; }
  if(d.dismiss){ const m=S.msgs.find(x=>x.id===d.dismiss); if(m) m.crisis=false; renderChat(); return; }
  if(d.savereport){ S.reports++; closeSheet(); toast('Saved on this phone. Email it from Settings when you choose.'); return; }
  if(d.sys){ $('#sysbar').classList.remove('on'); $('#main').classList.remove('has-sysbar'); if(d.sys==='summ'){ S.ctx=Math.round(S.ctx*0.3); meter(); toast('Summarized earlier turns on device. Context freed.'); } return; }
  if(d.new){ S.msgs=[]; S.attach=[]; S.ctx=0; S.incognito = d.new==='incog'; go('chat'); if(S.incognito) toast('Incognito. Nothing is written to disk.'); return; }
  if(d.open){ S.msgs=[]; S.attach=[]; S.ctx=0; S.incognito=false; const c=S.chats.find(x=>x.id===d.open); if(c.id==='c1'){ S.attach=[{name:'Lease_2026.pdf',pages:14,state:'indexed'}]; S.msgs=[{role:'me',text:'What are the key points of this lease?'},{id:'m0',role:'ai',text:ANSWERS.doc,model:'FAST 2B',modelFull:'QWEN3.5 2B',quant:'Q4_K_M',done:true,cites:true,tps:33,ctx:612,msTok:29,secs:'5.8',ptoks:410,otoks:190,energy:'0.06'}]; S.ctx=612; } else if(c.id==='c5'){ S.msgs=[{role:'me',text:'תתרגם לאנגלית: סבתא, אני חושב עלייך כל יום.'},{id:'m0',role:'ai',text:'Grandma, I think about you every day.',model:'FAST 2B',modelFull:'QWEN3.5 2B',quant:'Q4_K_M',done:true,tps:36,ctx:60,msTok:29,secs:'0.9',ptoks:22,otoks:9,energy:'0.00'}]; S.ctx=60; } else if(c.id==='c2'){ S.msgs=[{role:'me',text:'One day in Rome on foot, no bookings.'},{id:'m0',role:'ai',text:ANSWERS.rome,model:'FAST 2B',modelFull:'QWEN3.5 2B',quant:'Q4_K_M',done:true,tps:34,ctx:230,msTok:29,secs:'6.1',ptoks:14,otoks:120,energy:'0.04'}]; S.ctx=230; } go('chat'); return; }
  if(d.get){ if(!S.pro && S.catalog.find(c=>c.id===d.get).tier==='pro'){ go('paywall'); return;} getModel(d.get); return; }
  if(d.load){ loadModel(d.load); return; }
  if(d.pause){ const c=S.catalog.find(x=>x.id===d.pause); c.state='avail'; renderVault(); toast('Paused. Resumes on Wi‑Fi.'); return; }
  if(d.explain){ openSheet('explain', d.explain); return; }
  if(d.details){ openSheet('details', d.details); return; }
  if(d.import){ toast('Files picker (SAF / Files). Validates GGUF header before Load.'); return; }
  if(d.hf){ openSheet('hf'); return; }
  if(d.adddoc){ addDoc(d.adddoc); return; }
  if(d.ocr){ ocr(d.ocr); return; }
  if(d.ask){ const doc=S.docs.find(x=>x.id===d.ask); S.attach=[{name:doc.name,pages:doc.pages,state:'indexed'}]; S.msgs=[]; go('chat'); send('Summarize the key points of '+doc.name); return; }
  if(d.air){ airplaneTest(); return; }
  if(d.buy){ S.pro=true; $('#proBadge').hidden=false; renderPay(); toast('Pro unlocked on this device. Forever.'); return; }
  if(d.restore){ toast('Checking App Store… nothing to restore on this account.'); return; }
  if(d.lock){ showLock(); return; }
  if(d.unlock){ $('#lock').hidden=true; toast('Unlocked.'); return; }
  if(d.pchip){ NC.persona=d.pchip; openSheet('newchat'); return; }
  if(d.mrow){ NC.model=d.mrow; openSheet('newchat'); return; }
  if(d.startchat){ S.persona=NC.persona; S.model=NC.model; S.incognito=NC.incog; NC=null; S.msgs=[]; S.attach=[]; S.ctx=0; closeSheet(); go('chat'); if(S.incognito) toast('Incognito. Nothing is written to disk.'); return; }
  if(d.bench){ const o=$('#benchOut'); b.textContent='Running PP 512 / TG 128…'; b.disabled=true; await sleep(1800); if(o) o.innerHTML='<b>PP 512</b> 214 t/s · <b>TG 128</b> 34.2 tok/s · RSS 1.9 GB · GPU Metal · thermal nominal'; b.textContent='Benchmark again'; b.disabled=false; return; }
  if(d.setdefault){ const c=S.catalog.find(x=>x.id===d.setdefault); if(c.state==='avail'){ toast('Get it first.'); return;} S.model=d.setdefault; closeSheet(); renderChat(); toast(`${c.name} is the default now.`); return; }
  if(d.delmodel){ const c=S.catalog.find(x=>x.id===d.delmodel); if(c.state==='loaded'||c.id==='apple'){ toast('Unload it first.'); return;} c.state='avail'; closeSheet(); renderVault(); toast(`${c.name} deleted. ${fmtB(c.size)} freed.`); return; }
  if(d.usep){ S.persona=d.usep; renderPersonas(); toast(`${personaName()} is active for new chats.`); return; }
  if(d.editp){ PE=null; openSheet('persona', d.editp); return; }
  if(d.newp){ const custom=S.personas.filter(p=>!p.builtin).length; if(!S.pro && custom>=3){ toast('Free plan: 3 custom personas.'); go('paywall'); return;} PE=null; openSheet('persona', null); return; }
  if(d.picon||d.pmodel||d.ptool||d.pstyle){ PE.name=$('#pName').value; PE.prompt=$('#pPrompt').value; if(d.picon) PE.icon=d.picon; if(d.pmodel) PE.model=d.pmodel; if(d.ptool) PE.tools = PE.tools.includes(d.ptool)? PE.tools.filter(t=>t!==d.ptool) : [...PE.tools, d.ptool]; if(d.pstyle) PE.style=d.pstyle; openSheet('persona', PE.id); return; }
  if(d.savep){ PE.name=($('#pName').value||'').trim()||'Untitled'; PE.prompt=$('#pPrompt').value; if(PE.id){ const i=S.personas.findIndex(p=>p.id===PE.id); S.personas[i]={...S.personas[i],...PE}; } else { PE.id='p'+Date.now(); PE.builtin=false; S.personas.push({...PE}); } PE=null; closeSheet(); renderPersonas(); toast('Saved on this phone.'); return; }
  if(d.delp){ S.personas=S.personas.filter(p=>p.id!==d.delp); if(S.persona===d.delp) S.persona='assistant'; PE=null; closeSheet(); renderPersonas(); toast('Persona deleted.'); return; }
  if(d.memp){ const p=S.personas.find(x=>x.id===d.memp); p.mem = p.mem===false ? true : false; renderMemory(); return; }
  if(d.delfact){ S.facts.splice(+d.delfact,1); renderMemory(); toast('Forgotten.'); return; }
  if(d.editfact){ toast('Inline edit in the app; read-only in the demo.'); return; }
  if(d.addfact){ S.facts.push({t:'Reads Hebrew and English', src:'added by you', when:'now'}); renderMemory(); return; }
  if(d.runact){ runAction(d.runact); return; }
  if(d.runcustom){ if(!S.pro){ go('paywall'); return;} runAction(null, true); return; }
  if(d.actreplace){ toast('Replaced the selection in Safari.'); return; }
  if(d.actopen){ const t=S.actResult?.text||''; const rtl=!!S.actResult?.rtl; S.msgs=[]; S.attach=[]; S.ctx=180; S.incognito=false; S.msgs.push({role:'me',text:'From Safari: '+SHARED.slice(0,90)+'…'},{id:'m'+Date.now(),role:'ai',text:t,model:'FAST 2B',modelFull:'QWEN3.5 2B',quant:'Q4_K_M',done:true,tps:34,ctx:180,msTok:29,secs:'2.4',ptoks:90,otoks:60,energy:'0.02',rtl}); go('chat'); return; }
  if(d.newact){ if(!S.pro){ go('paywall'); return;} openSheet('action'); return; }
  if(d.saveact){ const n=($('#aName').value||'').trim()||'Untitled action'; S.actions.push({id:'a'+Date.now(), name:n, prompt:$('#aPrompt').value||''}); closeSheet(); renderActions(); toast('Saved.'); return; }
  if(d.wipe){ openSheet('wipe'); return; }
  if(d.dowipe){ closeSheet(); S.msgs=[]; S.attach=[]; S.docs=[]; S.chats=[]; S.ctx=0; toast('Deleted. There was no copy anywhere else.'); go('chat'); return; }
});
$('#scrim').addEventListener('click', closeSheet);
$('#input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); const v=e.target.value; e.target.value=''; e.target.style.height='auto'; send(v);} if(e.key==='Escape') stop(); });
$('#input').addEventListener('input', e => { e.target.style.height='auto'; e.target.style.height=Math.min(150,e.target.scrollHeight)+'px'; });

/* ---------------- boot ---------------- */
applyTheme();
const h=(location.hash||'').replace('#','');
if(h && ['chat','chats','vault','docs','personas','memory','actions','voice','proof','settings','paywall'].includes(h)){ if(h==='memory'||h==='voice'||h==='docs'){ S.pro=true; $('#proBadge').hidden=false; } go(h); } else { go('onb'); }
window.addEventListener('hashchange',()=>{ const x=(location.hash||'').replace('#',''); if(x) go(x); });
})();
</script>
