[package]
name = "inborn-desktop"
version = "0.0.1"
description = "Inborn desktop shell: a Tauri v2 window around the Expo web build with a native llama.cpp engine"
authors = ["Inborn"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
llama-cpp-2 = { version = "0.1.156", default-features = false }
minijinja = { version = "2", features = ["loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
encoding_rs = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.9"
fs4 = "1"

# SQLCipher: CommonCrypto on Apple, a vendored OpenSSL on Windows (no system OpenSSL on the Store build machines).
[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["metal"] }

[features]
# Windows GPU backends, chosen at build time by CI (`--features vulkan` is the universal build, `cuda` the NVIDIA one).
vulkan = ["llama-cpp-2/vulkan"]
# QA only (never in a shipped build): the control socket and the `INBORN_QA_KEY_FILE` secret source.
qa = []
cuda = ["llama-cpp-2/cuda"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
