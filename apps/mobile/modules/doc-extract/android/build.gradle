plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.inbornapp'
version = '0.0.1'

/* Tesseract language files come from INBORN_MODELS_DIR/ocr (tessdata/eng.traineddata, heb.traineddata), gitignored like the GGUFs. */
def modelsDir = System.getenv("INBORN_MODELS_DIR") ?: "${rootDir}/../../../.models"
def tessData = file("${modelsDir}/ocr/tessdata")
/* Never the whole ocr/ folder as an assets root: the podspec keeps ios/libtesseract.xcframework beside tessdata and it
   rode into the AAB as base/assets/ios (229 MB of Mach-O, vc8). Only this one named path is staged, so a new ocr/ sibling
   cannot reach Android at all. */
def stageTessData = tasks.register("stageOcrTessData", Sync) {
  from(tessData) {
    include "*.traineddata"
    into "tessdata"
  }
  into layout.buildDirectory.dir("generated/ocrAssets")
}

if (!tessData.isDirectory()) {
  logger.warn("[doc-extract] no OCR data at ${tessData}; scans will report 'OCR unavailable'")
}

android {
  namespace "com.inbornapp.docextract"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
  sourceSets {
    main {
      /* The provider carries the task dependency, so every consumer (merge, package, lint) waits for the staging. */
      assets.srcDir(stageTessData.map { it.destinationDir })
    }
  }
  packagingOptions {
    // pdfbox-android and tesseract4android both ship notices under META-INF.
    resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
  }
}

dependencies {
  // Text layer of PDFs (Apache-2.0); PdfRenderer only rasterizes.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
  // OCR fully on the device (Apache-2.0); ML Kit has no Hebrew model, so Tesseract with bundled traineddata.
  implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
