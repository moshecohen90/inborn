name: desktop

# macOS (arm64, Metal) and Windows (x64, Vulkan) shells from the same web export (spec §5.9, D9).
# Pull requests and pushes produce unsigned artefacts; a `v*` tag signs, notarizes and adds updater signatures
# when the secrets exist. CUDA is a manual extra (workflow_dispatch) because the toolkit is a 3 GB install.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      cuda:
        description: "Also build the Windows CUDA variant"
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  gate:
    name: gates (typecheck · lint · tests · CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm test
      - name: Webview CSP allows only Tauri's in-process IPC
        run: node apps/desktop/scripts/check-csp.mjs

  build:
    name: ${{ matrix.name }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (Metal)
            os: macos-14
            bundles: app,dmg
            features: ""
            artifact: inborn-macos-arm64
          - name: Windows x64 (Vulkan)
            os: windows-latest
            bundles: nsis
            features: --features vulkan
            artifact: inborn-windows-x64-vulkan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.artifact }}

      # llama.cpp's Vulkan backend compiles its shaders with glslc from the LunarG SDK.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
          stripdown: true

      - run: corepack pnpm install --frozen-lockfile

      - name: Web export + tauri build (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: corepack pnpm --filter @inborn/desktop tauri build --bundles ${{ matrix.bundles }} ${{ matrix.features }}

      # Tag builds: Developer ID + notarization on macOS (tauri-bundler reads APPLE_*), updater signatures on both.
      - name: Web export + tauri build (signed release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: corepack pnpm --filter @inborn/desktop tauri build --bundles ${{ matrix.bundles }} ${{ matrix.features }} --config src-tauri/tauri.release.conf.json

      - name: Verify hardened runtime and notarization ticket (macOS)
        if: runner.os == 'macOS'
        run: bash apps/desktop/scripts/verify-macos.sh apps/desktop/src-tauri/target/release/bundle/macos/Inborn.app ${{ startsWith(github.ref, 'refs/tags/v') && '--notarized' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig

  build-cuda:
    name: Windows x64 (CUDA, manual)
    needs: gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cuda }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: inborn-windows-x64-cuda
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @inborn/desktop tauri build --bundles nsis --features cuda
      - uses: actions/upload-artifact@v4
        with:
          name: inborn-windows-x64-cuda
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
